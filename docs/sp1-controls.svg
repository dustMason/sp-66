<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="600" viewBox="0 0 900 600" role="img"
     aria-labelledby="title desc">
  <title id="title">SP-66 control map on the Teenage Engineering SP-1</title>
  <desc id="desc">Front and edge line drawing of the SP-1. From left to right, the faders set tempo,
    balance, base rhythm and variation preset. Track buttons 1 through 3 select Rock, 2 Beat and
    4 Beat. Track 4 toggles the variation layer. Hold Function and tap Track 4 to pin or unpin the
    rhythm under Fader 3. The left rocker moves up toward B and down toward A, with Auto between them.
    The top buttons change volume. The front LEDs show the selected bank and whether the variation
    is on. While Function is held, the Track 4 LED shows whether the current rhythm is pinned.
    The right edge has Play, four Arrange and bar LEDs, and Function. Tap Function for a fill or
    hold it to shut down.</desc>

  <style>
    .shell, .edge, .endcap, .key, .detail, .slot, .leader, .port {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .shell { fill: #eceeeb; stroke: #353733; stroke-width: 1.65; }
    .edge { fill: #d7d9d4; stroke: #353733; stroke-width: 1.55; }
    .endcap { fill: #e9e2d4; stroke: #353733; stroke-width: 1.45; }
    .key { fill: #f2f2ed; stroke: #454742; stroke-width: 1.25; }
    .pin-side { fill: #babeb8; }
    .detail { fill: none; stroke: #777973; stroke-width: 1; }
    .slot { fill: #30332f; stroke: #20231f; stroke-width: 1.1; }
    .port { fill: #464843; stroke: #353733; stroke-width: 1.15; }
    .leader { fill: none; stroke: #85827a; stroke-width: 1.15; }
    .hole { fill: #555750; }
    .active { fill: #a53827; }
    .label, .hint { font-family: "Instrument Sans", Arial, sans-serif; }
    .label { fill: #242622; font-size: 19px; font-weight: 600; }
    .hint { fill: #4c4e47; font-size: 16px; }
    .id {
      fill: #813d30;
      font-family: "IBM Plex Mono", "Courier New", monospace;
      font-size: 15px;
    }
  </style>

  <defs>
    <g id="fader-slot">
      <rect class="slot" x="-5" y="252" width="10" height="73" rx="5"/>
      <path d="M2 257v63" fill="none" stroke="#62655f" stroke-width="1"/>
    </g>
    <g id="fader-pin">
      <path class="key pin-side" d="M-6-3v6c0 2.2 2.7 4 6 4s6-1.8 6-4v-6Z"/>
      <ellipse class="key" cx="0" cy="-3" rx="6" ry="4"/>
    </g>
    <g id="track-key">
      <rect class="key" x="-8.5" y="385" width="17" height="37" rx="2"/>
      <path class="detail" d="M6 389v29q0 1.5-1.5 1.5h-9"/>
    </g>
  </defs>

  <rect width="900" height="600" fill="#faf8f1"/>

  <!-- Show the edge controls in the same view as the front panel. -->
  <path class="edge" d="M324 110h242q17 0 27 16v332q0 12-17 24H324q-13 0-16-18V126q0-16 16-16Z"/>
  <path class="endcap" d="M533 110h33q17 0 27 16v332q0 12-17 24h-43Z"/>
  <path class="shell" d="M319 110h247q12 0 12 12v332q0 12-12 12H319q-11 0-11-12V122q0-12 11-12Z"/>
  <path class="endcap" d="M533 110h33q12 0 12 12v332q0 12-12 12h-33Z"/>
  <path class="detail" d="M317 455q1 4 7 4h201m56 3 5 9"/>

  <!-- Top edge volume buttons. -->
  <rect class="key" x="339" y="104" width="22" height="7" rx="2"/>
  <rect class="key" x="379" y="104" width="22" height="7" rx="2"/>

  <!-- Rocker and the play / LED / function edge. -->
  <rect class="key" x="299" y="156" width="11" height="47" rx="4"/>
  <path class="detail" d="M301 179.5h7"/>
  <circle class="hole" cx="311" cy="225" r="1.55"/>
  <rect class="key" x="584" y="142" width="12" height="58" rx="3"/>
  <path class="active" d="m555 163 6 10h-12Z"/>
  <g class="hole">
    <circle cx="589" cy="247" r="2.4"/>
    <circle cx="589" cy="266" r="2.4"/>
    <circle cx="589" cy="285" r="2.4"/>
    <circle cx="589" cy="304" r="2.4"/>
    <circle cx="555" cy="395" r="2"/>
    <circle cx="555" cy="403" r="2"/>
  </g>
  <rect class="key" x="584" y="369" width="12" height="58" rx="3"/>

  <!-- Front panel fader slots, metal pins, LEDs and track keys. -->
  <g>
    <use xlink:href="#fader-slot" x="343"/>
    <use xlink:href="#fader-slot" x="396"/>
    <use xlink:href="#fader-slot" x="449"/>
    <use xlink:href="#fader-slot" x="502"/>
    <use xlink:href="#fader-pin" x="343" y="272"/>
    <use xlink:href="#fader-pin" x="396" y="288"/>
    <use xlink:href="#fader-pin" x="449" y="305"/>
    <use xlink:href="#fader-pin" x="502" y="262"/>
    <use xlink:href="#track-key" x="343"/>
    <use xlink:href="#track-key" x="396"/>
    <use xlink:href="#track-key" x="449"/>
    <use xlink:href="#track-key" x="502"/>
    <circle class="active" cx="343" cy="354" r="2.5"/>
    <circle class="hole" cx="396" cy="354" r="2.3"/>
    <circle class="hole" cx="449" cy="354" r="2.3"/>
    <circle class="active" cx="502" cy="354" r="2.5"/>
  </g>
  <g class="id" text-anchor="middle">
    <text x="343" y="239">F1</text>
    <text x="396" y="239">F2</text>
    <text x="449" y="239">F3</text>
    <text x="502" y="239">F4</text>
  </g>

  <rect class="port" x="335" y="471" width="35" height="6" rx="3"/>
  <ellipse class="port" cx="463" cy="474" rx="5" ry="3.3"/>
  <ellipse class="port" cx="510" cy="474" rx="5" ry="3.3"/>

  <!-- Callouts -->
  <path class="leader" d="M350 99V92h40v7m-20-7V82"/>
  <text class="label" x="370" y="54" text-anchor="middle">Volume − / +</text>
  <text class="hint" x="370" y="75" text-anchor="middle">Master output</text>

  <path class="leader" d="M226 180h67m0-16v32m0-32h3m-3 32h3"/>
  <text class="label" x="48" y="159">Arrange rocker</text>
  <text class="hint" x="48" y="183">Up toward B</text>
  <text class="hint" x="48" y="204">Down toward A</text>
  <text class="hint" x="48" y="225">Auto between A and B</text>

  <g>
    <text class="id" x="48" y="275">F1</text>
    <text class="label" x="80" y="275">Tempo</text>
    <text class="hint" x="80" y="295">50–200 BPM</text>

    <text class="id" x="48" y="329">F2</text>
    <text class="label" x="80" y="329">Balance</text>
    <text class="hint" x="80" y="349">Bass drum / treble</text>

    <text class="id" x="48" y="383">F3</text>
    <text class="label" x="80" y="383">Base rhythm</text>
    <text class="hint" x="80" y="403">Off or one of 9 rhythms</text>

    <text class="id" x="48" y="437">F4</text>
    <text class="label" x="80" y="437">Variation preset</text>
    <text class="hint" x="80" y="457">One of 6 in the selected bank</text>
  </g>

  <path class="leader" d="M602 171h47
                          M602 247h10v57h-10 M612 276h37
                          M512 354h137
                          M602 398h47"/>
  <text class="label" x="662" y="168">Play</text>
  <text class="hint" x="662" y="190">Start or stop</text>
  <text class="label" x="662" y="271">Side LEDs</text>
  <text class="hint" x="662" y="293">Arrange and bar position</text>
  <text class="label" x="662" y="344">Track LEDs</text>
  <text class="hint" x="662" y="366">Bank and variation status</text>
  <text class="label" x="662" y="398">Function</text>
  <text class="hint" x="662" y="420">Tap for a fill</text>
  <text class="hint" x="662" y="441">Hold to shut down</text>

  <path class="leader" d="M343 429v9l-17 22v22l-111 34
                          M396 429v10l-8 21v22l-25 34
                          M449 429v10l-4 21v22l66 34
                          M502 429v9l27 22v22l130 34"/>
  <g text-anchor="middle">
    <text class="id" x="215" y="538">T1</text>
    <text class="label" x="215" y="563">Rock bank</text>
    <text class="id" x="363" y="538">T2</text>
    <text class="label" x="363" y="563">2 Beat bank</text>
    <text class="id" x="511" y="538">T3</text>
    <text class="label" x="511" y="563">4 Beat bank</text>
    <text class="id" x="659" y="538">T4</text>
    <text class="label" x="659" y="563">Toggle variation</text>
    <text class="hint" x="659" y="584">Function + T4 pins / unpins</text>
  </g>
</svg>
