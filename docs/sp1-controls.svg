      <rect class="key" x="-8" y="403" width="16" height="35" rx="3"/>
      <path class="bevel" d="M-5.5 434v-27q0-1.5 1.5-1.5h8"/>
    </g>
  </defs>

  <rect width="900" height="646" rx="8" fill="#f8f8f4"/>

