<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="694" viewBox="0 0 900 694" role="img"
     aria-labelledby="title description">
  <title id="title">SP-66 controls on the Teenage Engineering SP-1</title>
  <desc id="description">Vector drawing of the SP-1 with top and left edge details.
    From left to right, the four faders set tempo from 50 to 200 BPM, bass-to-treble
    balance, base rhythm, and the preset in the selected variation bank.
    Track buttons 1, 2 and 3 select Rock, 2 Beat and 4 Beat. Track 4 toggles the
    variation. Hold Function and tap Track 4 to pin or unpin the current base rhythm.
    The top buttons lower and raise volume. Press the left rocker down toward A
    or up toward B, one step at a time through A, Auto and B. Auto plays A then B.
    The right edge has Play, four Arrange and bar LEDs, and Function. Tap Function
    while playing for a fill on the next bar, or hold it to shut down.
    The bottom USB-C port receives MIDI clock. The headphone jack is next to it.</desc>

  <style>
    .case, .panel, .rail, .key, .pin-side, .pin-top, .port {
      stroke: #333531;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .case, .panel { stroke-width: 1.5; }
    .rail, .key, .pin-side, .pin-top, .port { stroke-width: 1.15; }
    .rail { fill: #353735; }
    .key { fill: #e6e6df; }
    .pin-side { fill: #a2a49f; }
    .pin-top { fill: #dfe0d9; }
    .port { fill: #2c2e2a; }
    .ink, .fine, .rim, .leader {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ink { stroke: #333531; stroke-width: 1.25; }
    .fine { stroke: #797c75; stroke-width: 1; }
    .rim { stroke: #fffdf5; stroke-width: 1.15; }
    .leader { stroke: #74776e; stroke-width: 1.15; }
    .mark { fill: #333531; }
    .lit { fill: #fffdf1; stroke: #5e6158; stroke-width: .85; }
    .accent { fill: #b92f24; }
    .label, .hint { font-family: "Geist", Arial, sans-serif; }
    .label { fill: #252722; font-size: 22px; font-weight: 600; }
    .hint { fill: #4c4f47; font-size: 18px; }
    .ref {
      fill: #9d2e23;
      font: 600 15px "IBM Plex Mono", "Courier New", monospace;
    }
  </style>

