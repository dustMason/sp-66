<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="672" viewBox="0 0 900 672" role="img"
     aria-labelledby="title description">
  <title id="title">SP-66 control map for the Teenage Engineering SP-1</title>
  <desc id="description">An angled line drawing of the SP-1 with separate views of
    the top and right edges. From left to right, the four faders set tempo from
    50 to 200 BPM, bass-to-treble balance, base rhythm, and one of six presets in
    the selected variation bank. Track buttons 1, 2 and 3 select Rock, 2 Beat and
    4 Beat. Track 4 toggles the variation. Hold Function and tap Track 4 to pin
    or unpin the current base rhythm. The top buttons lower and raise volume.
    The left rocker steps through A, Auto and B. Press up toward B or down
    toward A. Auto plays A then B. On the right edge, Play starts or stops
    playback. Four LEDs show the Arrange setting and bar. Tap Function while
    playing to fill on the next bar or hold it to shut down. On the bottom edge,
    USB-C receives MIDI clock and transport. The headphone jack is beside it.</desc>

  <style>
    .outline, .slot, .key, .port {
      stroke: #303430;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .outline { stroke-width: 1.5; }
    .slot, .key, .port { stroke-width: 1.15; }
    .slot { fill: #333834; }
    .key { fill: #e5e6df; }
    .key.shadow { fill: #aeb4ac; }
    .port { fill: #303430; }
    .ink, .edge, .highlight, .leader {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ink { stroke: #303430; stroke-width: 1.2; }
    .edge { stroke: #767d76; stroke-width: .9; }
    .highlight { stroke: #f8f8ee; stroke-width: 1.1; }
    .leader { stroke: #737b72; stroke-width: 1; }
    .dark { fill: #303430; }
    .lit { fill: #fffcf0; stroke: #535b53; stroke-width: .9; }
    .accent { fill: #ba3528; }
    .label, .hint { font-family: Geist, Arial, sans-serif; }
    .label { fill: #252b26; font-size: 22px; font-weight: 600; }
    .hint { fill: #4b544c; font-size: 18px; }
    .id, .view {
      font: 600 14px "IBM Plex Mono", "Courier New", monospace;
    }
    .id { fill: #9a3329; }
    .view { fill: #566056; letter-spacing: 1.3px; }
  </style>

  <defs>
    <path id="face" d="M9 0h246q9 0 9 9v352q0 9-9 9H9q-9 0-9-9V9q0-9 9-9Z"/>
    <clipPath id="face-clip"><use xlink:href="#face"/></clipPath>
    <path id="case" d="M9 0h246q9 0 9 9v352l-26 23q0 9-9 9H-17
                       q-9 0-9-9V32q0-6 4-9L4 2q2-2 5-2Z"/>
    <clipPath id="case-clip"><use xlink:href="#case"/></clipPath>

    <g id="fader">
      <rect class="slot" x="-5.6" y="148" width="11.2" height="74" rx="5.6"/>
      <path class="edge" d="M3 154v62"/>
      <path class="highlight" d="M-6.9 155v60q0 8 6.9 8"/>
    </g>
    <g id="fader-pin">
      <path class="outline" fill="#a9afa8" d="M-6 0v6q0 4 6 4t6-4V0Z"/>
      <ellipse class="key" rx="6" ry="4.3"/>
      <path class="highlight" d="M-3.4-1.5q3.4-2.1 6.8 0"/>
    </g>
    <g id="track-key">
      <rect class="key shadow" x="-7.7" y="291" width="15.4" height="36" rx="2"/>
      <rect class="key" x="-7.7" y="288" width="15.4" height="36" rx="2"/>
      <path class="highlight" d="M-5.4 321v-28q0-2.6 2.6-2.6H5"/>
    </g>
  </defs>

  <rect x=".5" y=".5" width="899" height="671" rx="7" fill="#f7f7f3" stroke="#dedfd7"/>

  <!-- Top edge with the two volume buttons. -->
  <g>
    <rect class="outline" x="232" y="29" width="264" height="29" rx="5" fill="#d5d9d2"/>
    <path d="M452 29h39q5 0 5 5v19q0 5-5 5h-39Z" fill="#e9e3d3"/>
    <rect class="outline" x="232" y="29" width="264" height="29" rx="5" fill="none"/>
    <path class="ink" d="M452 29v29"/>
    <path class="highlight" d="M238 32h209m10 0h32"/>
    <rect class="key" x="257" y="37" width="25" height="13" rx="3"/>
    <rect class="key" x="304" y="37" width="25" height="13" rx="3"/>
    <path class="ink" d="M266 43.5h7m40 0h7m-3.5-3.5v7"/>
    <text class="view" x="510" y="48">TOP EDGE</text>
  </g>

  <!-- The front, left and bottom share one projection. -->
  <g transform="matrix(1 -.23 .43 .91 235 146)">
    <use xlink:href="#case" fill="#bac0b9"/>
    <path d="M0 361q0 9 9 9h255v23H-26v-9Z"
          fill="#cdd2ca" clip-path="url(#case-clip)"/>
    <path d="M220 370h44v23h-70Z" fill="#dfd7c3" clip-path="url(#case-clip)"/>
    <path class="ink" d="M220 370l-26 23"/>
    <path class="edge" d="M-22 116v263q0 10 9 10h203m9 0h27"/>
    <use xlink:href="#case" class="outline" fill="none"/>

    <g transform="matrix(1 -.8846 0 1 0 0)">
      <rect class="slot" x="-21" y="48" width="16" height="40" rx="4"/>
      <rect class="outline" x="-28" y="50" width="17" height="36" rx="4" fill="#e8e0cb"/>
      <path class="highlight" d="M-25 81V55q0-2 2-2h8"/>
      <path class="edge" d="M-25 68h11"/>
      <circle class="dark" cx="-12" cy="124" r="1.75"/>
    </g>

    <g transform="matrix(1 0 -1.1304 1 0 370)">
      <rect class="port" x="47" y="6.5" width="44" height="10" rx="5"/>
      <path class="edge" d="M54 11.5h30"/>
      <ellipse class="port" cx="159" cy="11.5" rx="8.5" ry="5.25"/>
      <ellipse class="port" cx="207" cy="11.5" rx="8.5" ry="5.25"/>
    </g>

    <use xlink:href="#face" fill="#e1e4de"/>
    <path d="M220 0h44v370h-44Z" fill="#ede7d7" clip-path="url(#face-clip)"/>
    <use xlink:href="#face" class="outline" fill="none"/>
    <path class="ink" d="M220 0v370"/>
    <path class="highlight" d="M3.5 359V10q0-6.5 6.5-6.5h206m8 0h30q6.5 0 6.5 6.5v349"/>
    <path class="edge" d="M10 366h206m8 0h30"/>

    <path class="accent" d="M243 59l6.2 10.7h-12.4Z"/>
    <circle class="dark" cx="243" cy="296" r="2"/>
    <circle class="dark" cx="243" cy="307" r="2"/>

    <use xlink:href="#fader" x="32"/>
    <use xlink:href="#fader" x="84"/>
    <use xlink:href="#fader" x="137"/>
    <use xlink:href="#fader" x="189"/>
    <use xlink:href="#fader-pin" x="32" y="178"/>
    <use xlink:href="#fader-pin" x="84" y="187"/>
    <use xlink:href="#fader-pin" x="137" y="164"/>
    <use xlink:href="#fader-pin" x="189" y="200"/>

    <circle class="lit" cx="32" cy="254" r="2.65"/>
    <circle class="dark" cx="84" cy="254" r="2.3"/>
    <circle class="dark" cx="137" cy="254" r="2.3"/>
    <circle class="lit" cx="189" cy="254" r="2.65"/>
    <use xlink:href="#track-key" x="32"/>
    <use xlink:href="#track-key" x="84"/>
    <use xlink:href="#track-key" x="137"/>
    <use xlink:href="#track-key" x="189"/>

    <g class="id" text-anchor="middle">
      <text x="32" y="136">F1</text>
      <text x="84" y="136">F2</text>
      <text x="137" y="136">F3</text>
      <text x="189" y="136">F4</text>
      <text x="32" y="348">T1</text>
      <text x="84" y="348">T2</text>
      <text x="137" y="348">T3</text>
      <text x="189" y="348">T4</text>
    </g>
  </g>

  <!-- The right edge contains two buttons and four Arrange LEDs. -->
  <g>
    <text class="view" x="670" y="132">RIGHT EDGE</text>
    <rect class="outline" x="670" y="145" width="25" height="299" rx="5" fill="#e9e3d3"/>
    <path class="highlight" d="M673 437V151q0-3 3-3h13"/>
    <rect class="key" x="675" y="172" width="15" height="53" rx="2.5"/>
    <rect class="key" x="675" y="362" width="15" height="53" rx="2.5"/>
    <path class="highlight" d="M678 221v-45h9m-9 235v-45h9"/>
    <circle class="dark" cx="682.5" cy="252" r="2.4"/>
    <circle class="lit" cx="682.5" cy="268" r="2.7"/>
    <circle class="dark" cx="682.5" cy="284" r="2.4"/>
    <circle class="dark" cx="682.5" cy="300" r="2.4"/>
  </g>

  <path class="leader" d="M179 43.5h43 M197 189h19l24 32
                         M695 198.5h22 M695 276h22 M695 388.5h22"/>
  <text class="label" x="32" y="47">Volume − / +</text>
  <text class="hint" x="32" y="70">Master output</text>
  <text class="label" x="32" y="193">Arrange rocker</text>
  <text class="hint" x="32" y="217">Up steps toward B</text>
  <text class="hint" x="32" y="239">Down steps toward A</text>
  <text class="hint" x="32" y="261">Auto plays A then B</text>

  <g>
    <text class="id" x="32" y="297">F1</text>
    <text class="label" x="64" y="297">Tempo</text>
    <text class="hint" x="64" y="319">50–200 BPM</text>
    <text class="id" x="32" y="352">F2</text>
    <text class="label" x="64" y="352">Balance</text>
    <text class="hint" x="64" y="374">Bass drum to treble</text>
    <text class="id" x="32" y="407">F3</text>
    <text class="label" x="64" y="407">Base rhythm</text>
    <text class="hint" x="64" y="429">Off or one of 9 rhythms</text>
    <text class="id" x="32" y="462">F4</text>
    <text class="label" x="64" y="462">Variation preset</text>
    <text class="hint" x="64" y="484">Six per bank</text>
  </g>

  <text class="label" x="729" y="197">Play</text>
  <text class="hint" x="729" y="220">Start / stop</text>
  <text class="label" x="729" y="274">Side LEDs</text>
  <text class="hint" x="729" y="297">Arrange and bar</text>
  <text class="label" x="729" y="386">Function</text>
  <text class="hint" x="729" y="409">Tap for next-bar fill</text>
  <text class="hint" x="729" y="432">Hold to shut down</text>

  <path class="leader" d="M452 496l-24 11v9 M545 474l28 33v9"/>
  <g text-anchor="middle">
    <text class="label" x="428" y="538">USB-C</text>
    <text class="hint" x="428" y="561">MIDI clock + transport</text>
    <text class="label" x="573" y="538">Headphones</text>
  </g>

  <path class="leader" opacity=".55" d="M32 582h836"/>
  <text class="view" x="32" y="608">TRACK BUTTONS</text>
  <text class="hint" x="868" y="608" text-anchor="end">Track LEDs show bank and variation state</text>
  <g>
    <text class="id" x="32" y="638">T1</text>
    <text class="label" x="64" y="638">Rock bank</text>
    <text class="id" x="210" y="638">T2</text>
    <text class="label" x="242" y="638">2 Beat bank</text>
    <text class="id" x="388" y="638">T3</text>
    <text class="label" x="420" y="638">4 Beat bank</text>
    <text class="id" x="566" y="638">T4</text>
    <text class="label" x="598" y="638">Toggle variation</text>
    <text class="hint" x="598" y="660">Hold Function + T4 to pin / unpin</text>
  </g>
</svg>
