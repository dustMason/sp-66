  <use xlink:href="#leader-dot" x="497" y="500"/>
  <use xlink:href="#leader-dot" x="596" y="471"/>
  <g text-anchor="middle">
    <text class="label" x="440" y="570">USB-C</text>
    <text class="note" x="440" y="595">MIDI clock + transport in</text>
    <text class="label" x="640" y="570">Headphones</text>
    <text class="note" x="640" y="595">Audio out</text>
  </g>

  <path d="M30 614h884" stroke="#d9d6cd"/>
  <text class="caption" x="30" y="638">TRACK BUTTONS</text>
  <text class="note" x="914" y="638" text-anchor="end">Track LEDs show bank and variation</text>
  <g class="id">
    <text x="30" y="668">T1</text>
    <text x="196" y="668">T2</text>
    <text x="367" y="668">T3</text>
    <text x="545" y="668">T4</text>
  </g>
  <g class="label">
    <text x="66" y="668">Rock</text>
    <text x="232" y="668">2 Beat</text>
    <text x="403" y="668">4 Beat</text>
    <text x="581" y="668">Toggle variation</text>
  </g>
  <text class="note" x="581" y="693">Hold Function, tap T4 to pin / unpin</text>
</svg>
