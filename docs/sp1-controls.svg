    <use xlink:href="#rail" x="450"/>
    <use xlink:href="#rail" x="507"/>
    <use xlink:href="#stem" x="336" y="281"/>
    <use xlink:href="#stem" x="393" y="296"/>
    <use xlink:href="#stem" x="450" y="271"/>
