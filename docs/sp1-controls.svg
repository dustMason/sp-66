      <ellipse class="pin-top" rx="6.1" ry="4.3"/>
      <path class="rim" d="M-3.5-1.8q3.5-2.2 7 0"/>
    </g>
    <g id="track">
      <rect class="pin-side" x="-8.3" y="327" width="16.6" height="42" rx="2.3"/>
