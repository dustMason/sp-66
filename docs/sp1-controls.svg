<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="944" height="732" viewBox="0 0 944 732"
     role="img" aria-labelledby="title description">
  <title id="title">SP-66 control map for the Teenage Engineering SP-1</title>
  <desc id="description">An angled SP-1 line drawing with top and right edge
    views. Faders 1 through 4 set tempo, bass and treble balance, base rhythm,
    and a preset in the selected variation bank. Track buttons 1 through 3
    select Rock, 2 Beat, or 4 Beat. Track 4 toggles that variation. Hold Function
    and tap Track 4 to pin or unpin the selected base rhythm. The LEDs above
    the track buttons show the bank and variation status. Press the left
    rocker up toward B or down toward A to move through A, Auto and B. Auto
    plays A then B. The top buttons adjust the master volume. On the right edge
    Play starts or stops playback, the four LEDs show the arrangement and bar
    position, and Function queues a fill with a tap or shuts down with a hold.
    The bottom edge has USB-C for MIDI clock and transport input and a
    headphone jack for audio output.</desc>

  <style>
    .case, .key, .socket, .detail, .highlight, .leader, .guide {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .case { stroke: #383a37; stroke-width: 1.6; }
    .key { stroke: #60615a; stroke-width: 1; }
    .socket { fill: #30322f; stroke: #51534d; stroke-width: 1; }
    .detail, .highlight, .leader, .guide { fill: none; }
    .detail { stroke: #74766d; stroke-width: 1; }
    .highlight { stroke: #f7f6f0; stroke-width: 1; }
    .leader { stroke: #85837b; stroke-width: 1.15; }
    .guide { stroke: #a2493d; stroke-width: 1.1; }
    .label, .note { font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; }
    .label { fill: #252623; font-size: 24px; font-weight: 700; }
    .note { fill: #504f48; font-size: 20px; }
    .id, .caption { font-family: "IBM Plex Mono", Menlo, monospace; font-weight: 600; }
    .id { fill: #a3382e; font-size: 17px; }
    .caption { fill: #605d54; font-size: 15px; letter-spacing: 1px; }
  </style>

  <defs>
    <path id="deck" d="M8 0h244a8 8 0 0 1 8 8v348a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8V8a8 8 0 0 1 8-8Z"/>
    <path id="shell" d="M.99 4.14A8 8 0 0 1 8 0h244a8 8 0 0 1 8 8v348
                       a8 8 0 0 1-.99 3.86l-16 29A8 8 0 0 1 236 393H-8
                       a8 8 0 0 1-8-8V37a8 8 0 0 1 .99-3.86Z"/>
    <clipPath id="deck-clip"><use xlink:href="#deck"/></clipPath>
    <clipPath id="shell-clip"><use xlink:href="#shell"/></clipPath>

    <g id="fader">
      <rect class="socket" x="-5.6" y="146" width="11.2" height="73" rx="5.6"/>
      <path class="detail" d="M2.7 152v60"/>
      <path class="highlight" d="M-6.9 155v58q0 7.2 6.6 7.2"/>
    </g>
    <g id="fader-cap">
      <path class="key" fill="#9fa19b" d="M-5.9 0v6.2q0 4 5.9 4t5.9-4V0Z"/>
      <ellipse class="key" rx="5.9" ry="4.2" fill="#dedfd9"/>
      <path class="highlight" d="M-3.2-1.4q3.2-2.2 6.4 0"/>
    </g>
    <g id="track-key">
      <rect class="key" x="-8.5" y="284.8" width="17" height="35.8" rx="2" fill="#92958e"/>
      <rect class="key" x="-8.5" y="282.8" width="17" height="35.8" rx="2" fill="#dcddd7"/>
      <path class="highlight" d="M-6.6 315.4v-28.8q0-1.8 1.8-1.8H6"/>
    </g>
    <circle id="led-off" r="2.5" fill="#41413a"/>
    <circle id="led-on" r="2.75" fill="#fff6dc" stroke="#5f5e55" stroke-width=".9"/>
    <circle id="leader-dot" r="2.4" fill="#76746b"/>
  </defs>

  <rect x=".5" y=".5" width="943" height="731" rx="12" fill="#faf9f5" stroke="#d9d6cd"/>

  <!-- Top edge -->
  <text class="label" x="30" y="48">Volume</text>
  <text class="note" x="30" y="74">Master output</text>
  <path class="leader" d="M139 40h160"/>
  <use xlink:href="#leader-dot" x="299" y="40"/>
  <g transform="translate(310 28)">
    <rect class="case" width="260" height="26" rx="6" fill="#d2d3cd"/>
    <path d="M217 0h37a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-37Z" fill="#e7e2d6"/>
    <path class="detail" d="M217 0v26"/>
    <path class="highlight" d="M6 2.5h208m6 0h34"/>
    <rect class="key" x="25" y="8" width="29" height="10" rx="1.6" fill="#a2a49c"/>
    <rect class="key" x="71" y="8" width="29" height="10" rx="1.6" fill="#a2a49c"/>
    <path class="highlight" d="M28 10h23m23 0h23"/>
    <rect class="case" width="260" height="26" rx="6" fill="none"/>
  </g>
  <path class="guide" d="M345 67h9m37 0h9m-4.5-4.5v9"/>
  <text class="caption" x="591" y="47">TOP EDGE</text>

  <!-- Front, left and bottom of the same enclosure -->
  <g transform="matrix(1.035 -.242 .355 .997 245 156)">
    <use xlink:href="#shell" fill="#b0b2ab"/>
    <g clip-path="url(#shell-clip)">
      <path fill="#9fa19a" d="M8 356h252v38H-16l8-9Z"/>
      <path fill="#cec7b8" d="M217 356h43v38h-59v-1Z"/>
      <path class="detail" d="M217 364l-16 29M8 364l-16 29"/>
      <path class="highlight" d="M-13 42v339m11 8h200m6 0h31"/>
    </g>
    <use xlink:href="#shell" class="case" fill="none"/>

    <g transform="matrix(-.551724 1 0 1 0 0)">
      <rect class="socket" x="4" y="47" width="19" height="41" rx="4.2"/>
      <rect class="key" x="7" y="49" width="18" height="37" rx="3.5" fill="#e6e0d2"/>
      <path class="highlight" d="M9.5 83V54q0-2.5 2.5-2.5h9"/>
      <path class="detail" d="M10.5 67.5h11"/>
      <circle cx="15" cy="113" r="1.6" fill="#41413a"/>
    </g>

    <!-- The two TRS sockets have identical outer dimensions. -->
    <g transform="matrix(1 0 -.551724 1 0 364)">
      <rect class="socket" x="44" y="9" width="41" height="10" rx="4.8"/>
      <path class="detail" d="M49 14h31"/>
      <ellipse class="socket" cx="162" cy="14" rx="8.5" ry="5.6"/>
      <ellipse class="socket" cx="209" cy="14" rx="8.5" ry="5.6"/>
      <path class="detail" d="M157 16.6q5 2.7 10 0m37 0q5 2.7 10 0"/>
    </g>

    <use xlink:href="#deck" fill="#dcded8"/>
    <path d="M217 0h43v364h-43Z" clip-path="url(#deck-clip)" fill="#eee9dd"/>
    <path class="detail" d="M217 0v364"/>
    <path class="highlight" d="M3 354V9q0-6 6-6h204m7 0h31q6 0 6 6v345M9 361h204m7 0h31"/>
    <use xlink:href="#deck" class="case" fill="none"/>

    <path d="M238.5 57l6.5 11h-13Z" fill="#bf3a2f"/>
    <circle cx="238.5" cy="292" r="2.05" fill="#41413a"/>
    <circle cx="238.5" cy="302" r="2.05" fill="#41413a"/>

    <use xlink:href="#fader" x="31"/>
    <use xlink:href="#fader" x="83"/>
    <use xlink:href="#fader" x="135"/>
    <use xlink:href="#fader" x="187"/>
    <use xlink:href="#fader-cap" x="31" y="162"/>
    <use xlink:href="#fader-cap" x="83" y="179"/>
    <use xlink:href="#fader-cap" x="135" y="164"/>
    <use xlink:href="#fader-cap" x="187" y="192"/>

    <use xlink:href="#led-on" x="31" y="250"/>
    <use xlink:href="#led-off" x="83" y="250"/>
    <use xlink:href="#led-off" x="135" y="250"/>
    <use xlink:href="#led-on" x="187" y="250"/>
    <use xlink:href="#track-key" x="31"/>
    <use xlink:href="#track-key" x="83"/>
    <use xlink:href="#track-key" x="135"/>
    <use xlink:href="#track-key" x="187"/>

    <path class="guide" d="M31 134v7m52-7v7m52-7v7m52-7v7
                           M31 324v6m52-6v6m52-6v6m52-6v6"/>
  </g>

  <!-- Annotation labels stay upright in the angled view. -->
  <g class="id" text-anchor="middle">
    <text x="321" y="277">F1</text>
    <text x="375" y="264">F2</text>
    <text x="429" y="252">F3</text>
    <text x="483" y="239">F4</text>
    <text x="400" y="495">T1</text>
    <text x="454" y="482">T2</text>
    <text x="508" y="470">T3</text>
    <text x="562" y="457">T4</text>
  </g>

  <path class="leader" d="M215 168h15l26 69h4"/>
  <use xlink:href="#leader-dot" x="260" y="237"/>
  <text class="label" x="30" y="175">Arrange rocker</text>
  <text class="note" x="30" y="202">↑ toward B · ↓ toward A</text>
  <text class="note" x="30" y="228">A ↔ Auto ↔ B</text>
  <text class="note" x="30" y="254">Auto plays A then B</text>

  <g class="id">
    <text x="30" y="317">F1</text>
    <text x="30" y="376">F2</text>
    <text x="30" y="435">F3</text>
    <text x="30" y="494">F4</text>
  </g>
  <g class="label">
    <text x="66" y="317">Tempo</text>
    <text x="66" y="376">Balance</text>
    <text x="66" y="435">Base rhythm</text>
    <text x="66" y="494">Variation preset</text>
  </g>
  <g class="note">
    <text x="66" y="342">50–200 BPM</text>
    <text x="66" y="401">Bass drum ↔ treble</text>
    <text x="66" y="460">Off or one of 9 rhythms</text>
    <text x="66" y="519">Six in the selected bank</text>
  </g>

  <!-- Right edge -->
  <text class="caption" x="674" y="105">RIGHT EDGE</text>
  <g transform="translate(675 120)">
    <rect class="case" width="30" height="364" rx="6" fill="#e7e2d6"/>
    <path class="highlight" d="M3 356V7q0-4 4-4h16"/>
    <rect class="key" x="6" y="33" width="18" height="64" rx="2.4" fill="#d2d2cb"/>
    <rect class="key" x="6" y="265" width="18" height="64" rx="2.4" fill="#d2d2cb"/>
    <path class="highlight" d="M8.5 94V37q0-1.5 1.5-1.5h12m-13.5 291v-57q0-1.5 1.5-1.5h12"/>
    <use xlink:href="#led-on" x="15" y="140"/>
    <use xlink:href="#led-off" x="15" y="155"/>
    <use xlink:href="#led-off" x="15" y="170"/>
    <use xlink:href="#led-off" x="15" y="185"/>
  </g>
  <path class="leader" d="M705 185h20m-20 97h20m-20 135h20"/>
  <text class="label" x="735" y="191">Play</text>
  <text class="note" x="735" y="217">Start / stop</text>
  <text class="label" x="735" y="288">Side LEDs</text>
  <text class="note" x="735" y="314">Arrange and bar</text>
  <text class="label" x="735" y="423">Function</text>
  <text class="note" x="735" y="449">Tap for next-bar fill</text>
  <text class="note" x="735" y="475">Hold to shut down</text>

  <!-- Bottom edge connections -->
  <path class="leader" d="M438 525l-33 22v9m136-55l35 42v13"/>
  <use xlink:href="#leader-dot" x="438" y="525"/>
  <use xlink:href="#leader-dot" x="541" y="501"/>
  <g text-anchor="middle">
    <text class="label" x="405" y="581">USB-C</text>
    <text class="note" x="405" y="606">MIDI clock + transport in</text>
    <text class="label" x="576" y="581">Headphones</text>
    <text class="note" x="576" y="606">Audio out</text>
  </g>

  <path d="M30 625h884" stroke="#d9d6cd"/>
  <text class="caption" x="30" y="649">TRACK BUTTONS</text>
  <text class="note" x="914" y="649" text-anchor="end">Track LEDs show bank and variation</text>
  <g class="id">
    <text x="30" y="680">T1</text>
    <text x="196" y="680">T2</text>
    <text x="367" y="680">T3</text>
    <text x="545" y="680">T4</text>
  </g>
  <g class="label">
    <text x="66" y="680">Rock</text>
    <text x="232" y="680">2 Beat</text>
    <text x="403" y="680">4 Beat</text>
    <text x="581" y="680">Toggle variation</text>
  </g>
  <text class="note" x="581" y="705">Hold Function, tap T4 to pin / unpin</text>
</svg>
