  <path class="leader" d="M747 181h17m-17 92h17m-17 126h17"/>
  <text class="label" x="774" y="187">Play</text>
  <text class="note" x="774" y="213">Start / stop</text>
  <text class="label" x="774" y="279">Side LEDs</text>
  <text class="note" x="774" y="305">Arrange + bar</text>
  <text class="label" x="774" y="405">Function</text>
  <text class="note" x="774" y="431">Tap · next-bar fill</text>
  <text class="note" x="774" y="457">Hold · power off</text>

  <!-- Bottom edge connections -->
