<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="644" viewBox="0 0 900 644" role="img"
     aria-labelledby="title description">
  <title id="title">SP-66 controls on the Teenage Engineering SP-1</title>
  <desc id="description">Oblique line drawing of the SP-1 with top and left edge details.
    Faders 1 to 4 set tempo, balance, base rhythm, and the preset within the variation bank.
    Track buttons 1 to 3 select Rock, 2 Beat, and 4 Beat. Track 4 toggles the variation.
    Hold Function and tap Track 4 to pin or unpin the selected base rhythm.
    The top buttons change volume. The left rocker steps through A, Auto, and B.
    Press up toward B or down toward A. Auto plays A then B.
    The right edge has Play, four LEDs for Arrange and bar position, and Function.
    Tap Function for a fill while playing or hold it to shut down.
    Connect a MIDI clock host to USB-C. The headphone jack is next to USB-C.</desc>

  <style>
    .edge, .metal, .cap, .cap-side, .button, .button-base, .recess, .lit {
      stroke: #343634;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .edge { fill: #d1d3d0; }
    .metal { fill: #e9eae6; }
    .cap { fill: #f0e9db; }
    .cap-side { fill: #e3d9c6; }
    .button { fill: #f3f3ee; }
    .button-base { fill: #babdb9; }
    .recess { fill: #40433f; }
    .lit { fill: #fffcf1; stroke-width: 1; }
    .detail, .highlight, .leader {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .detail { stroke: #848781; stroke-width: 1; }
    .highlight { stroke: #faf9f4; stroke-width: 1.15; }
    .leader { stroke: #737771; stroke-width: 1.1; }
    .mark { fill: #3c3f3a; }
    .play { fill: #b84230; }
    .label, .hint { font-family: "Geist", Arial, sans-serif; }
    .label { fill: #232522; font-size: 22px; font-weight: 600; }
    .hint { fill: #464a44; font-size: 18px; }
    .ref {
      fill: #a33b2c;
      font: 600 16px "IBM Plex Mono", "Courier New", monospace;
    }
  </style>

  <defs>
    <path id="case" d="M10 0h251q10 0 10 10l31 19v359q0 10-10 10H41q-7 0-12-4
                       L5 376q-5-3-5-7V10Q0 0 10 0Z"/>
    <clipPath id="case-clip"><use xlink:href="#case"/></clipPath>
    <clipPath id="front-clip"><rect width="271" height="379" rx="10"/></clipPath>
    <clipPath id="top-clip"><rect x="294" y="44" width="271" height="34" rx="7"/></clipPath>

    <g id="rail">
      <rect class="recess" x="-5" y="154" width="10" height="76" rx="4.4"/>
      <path class="detail" d="M2.4 159v66"/>
      <path class="highlight" d="M-6.6 160v63q0 7 6.6 8.5"/>
    </g>
    <g id="pin">
      <path class="button-base" d="M-6 0v6.5a6 3.9 0 0 0 12 0V0Z"/>
      <ellipse class="button" rx="6" ry="4"/>
    </g>
    <g id="track">
      <rect class="button-base" x="-8" y="295" width="16" height="37" rx="2.5"/>
      <rect class="button" x="-8" y="292" width="16" height="37" rx="2.5"/>
      <path class="highlight" d="M-5.5 326v-30q0-1.5 1.5-1.5h7"/>
    </g>
  </defs>

  <rect width="900" height="644" rx="8" fill="#faf9f5"/>

  <!-- Top and left edge elevations expose controls hidden by the main view. -->
  <rect class="edge" x="294" y="44" width="271" height="34" rx="7"/>
  <path class="cap-side" d="M519 43h47v36h-47Z" clip-path="url(#top-clip)"/>
  <rect x="294" y="44" width="271" height="34" rx="7" fill="none" stroke="#343634" stroke-width="1.4"/>
  <path class="highlight" d="M302 47h212m10 0h33"/>
  <circle class="button" cx="334" cy="61" r="8.5"/>
  <circle class="button" cx="381" cy="61" r="8.5"/>
  <path d="M330.5 61h7m40 0h7m-3.5-3.5v7" fill="none" stroke="#343634"
        stroke-width="1.25" stroke-linecap="round"/>

  <rect class="edge" x="253" y="139" width="24" height="96" rx="5"/>
  <path class="highlight" d="M274 146v82"/>
  <rect class="recess" x="256.5" y="160" width="14" height="46" rx="3"/>
  <path class="cap" d="M256 162q4-3 11-1v43q-7 2-11-1Z"/>
  <path class="detail" d="M258.5 182.5h6.5"/>
  <circle class="mark" cx="264" cy="219" r="1.65"/>

  <!-- The front, bottom and right edge share a single oblique projection. -->
  <g transform="matrix(1 -.085 .075 1 294 129)">
    <use xlink:href="#case" class="edge"/>
    <path class="cap-side" d="M225-2h49l29 18v384h-47l-31-19Z" clip-path="url(#case-clip)"/>
    <use xlink:href="#case" fill="none" stroke="#343634" stroke-width="1.4"/>

    <g transform="matrix(1 .6129 0 1 271 0)">
      <rect class="cap" x="6" y="34" width="20" height="62" rx="3.8"/>
      <path class="highlight" d="M9 91V40q0-3 3-3h9"/>
      <g class="mark">
        <circle cx="16" cy="141" r="2.5"/>
        <circle cx="16" cy="175" r="2.5"/>
        <circle cx="16" cy="192" r="2.5"/>
      </g>
      <circle class="lit" cx="16" cy="158" r="2.6"/>
      <rect class="cap" x="6" y="278" width="20" height="62" rx="3.8"/>
      <path class="highlight" d="M9 335v-51q0-3 3-3h9"/>
    </g>

    <g transform="matrix(1 0 1.63158 1 0 379)">
      <rect class="recess" x="47" y="5" width="38" height="9" rx="4.5"/>
      <path class="detail" d="M53 9.5h26"/>
      <ellipse class="recess" cx="169" cy="9.5" rx="7" ry="5.3"/>
      <ellipse class="recess" cx="207" cy="9.5" rx="7" ry="5.3"/>
    </g>

    <rect class="metal" width="271" height="379" rx="10"/>
    <path class="cap" d="M225-1h47v381h-47Z" clip-path="url(#front-clip)"/>
    <rect width="271" height="379" rx="10" fill="none" stroke="#343634" stroke-width="1.4"/>
    <path class="highlight" d="M4 366V11q0-7 7-7h210m8 0h31q7 0 7 7v355"/>

    <path class="play" d="M249 58l6 10h-12Z"/>
    <circle class="mark" cx="249" cy="301" r="1.85"/>
    <circle class="mark" cx="249" cy="311" r="1.85"/>

    <use xlink:href="#rail" x="33"/>
    <use xlink:href="#rail" x="87"/>
    <use xlink:href="#rail" x="141"/>
    <use xlink:href="#rail" x="195"/>
    <use xlink:href="#pin" x="33" y="179"/>
    <use xlink:href="#pin" x="87" y="194"/>
    <use xlink:href="#pin" x="141" y="168"/>
    <use xlink:href="#pin" x="195" y="185"/>

    <circle class="lit" cx="33" cy="260" r="2.6"/>
    <circle class="mark" cx="87" cy="260" r="2.35"/>
    <circle class="mark" cx="141" cy="260" r="2.35"/>
    <circle class="lit" cx="195" cy="260" r="2.6"/>
    <use xlink:href="#track" x="33"/>
    <use xlink:href="#track" x="87"/>
    <use xlink:href="#track" x="141"/>
    <use xlink:href="#track" x="195"/>

    <path class="leader" d="M19 126h176m-162 0v5m54-5v5m54-5v5m54-5v5"/>
    <g class="ref" text-anchor="middle">
      <text x="33" y="146">F1</text>
      <text x="87" y="146">F2</text>
      <text x="141" y="146">F3</text>
      <text x="195" y="146">F4</text>
      <text x="33" y="353">T1</text>
      <text x="87" y="353">T2</text>
      <text x="141" y="353">T3</text>
      <text x="195" y="353">T4</text>
    </g>
  </g>

  <!-- Fader legend and controls on the top and left edges. -->
  <path class="leader" d="M199 61h88 M226 182.5h21 M222 250h86l14.5 3.4"/>
  <text class="label" x="32" y="65">Volume − / +</text>
  <text class="hint" x="32" y="88">Master output</text>
  <text class="label" x="32" y="171">Arrange rocker</text>
  <text class="hint" x="32" y="195">↑ toward B · ↓ toward A</text>
  <text class="hint" x="32" y="217">Auto plays A then B</text>

  <g>
    <text class="ref" x="32" y="279">F1</text>
    <text class="label" x="64" y="279">Tempo</text>
    <text class="hint" x="64" y="301">50–200 BPM</text>
    <text class="ref" x="32" y="341">F2</text>
    <text class="label" x="64" y="341">Balance</text>
    <text class="hint" x="64" y="363">Bass drum ↔ treble</text>
    <text class="ref" x="32" y="403">F3</text>
    <text class="label" x="64" y="403">Base rhythm</text>
    <text class="hint" x="64" y="425">Off or one of 9 rhythms</text>
    <text class="ref" x="32" y="465">F4</text>
    <text class="label" x="64" y="465">Variation preset</text>
    <text class="hint" x="64" y="487">Six in the selected bank</text>
  </g>

  <!-- Play and Function buttons sit on the edge beside their face symbols. -->
  <path class="leader" d="M604 180h45m-34 76h9v54h-9m9-27h25
                         M518 372h31l12-16h88
                         M623 428h26"/>
  <text class="label" x="661" y="177">Play</text>
  <text class="hint" x="661" y="199">Start / stop</text>
  <text class="label" x="661" y="279">Side LEDs</text>
  <text class="hint" x="661" y="301">Arrange and bar position</text>
  <text class="label" x="661" y="352">Track LEDs</text>
  <text class="hint" x="661" y="374">Bank and variation status</text>
  <text class="label" x="661" y="425">Function</text>
  <text class="hint" x="661" y="447">Tap for next-bar fill</text>
  <text class="hint" x="661" y="469">Hold to shut down</text>

  <path class="leader" d="M405 522l-21 9 M508 515l25 16"/>
  <g class="hint" text-anchor="middle">
    <text x="372" y="552">USB-C · MIDI clock in</text>
    <text x="538" y="552">Headphones</text>
  </g>

  <path class="leader" d="M32 572h836"/>
  <g>
    <text class="ref" x="32" y="603">T1</text>
    <text class="label" x="64" y="603">Rock bank</text>
    <text class="ref" x="227" y="603">T2</text>
    <text class="label" x="259" y="603">2 Beat bank</text>
    <text class="ref" x="435" y="603">T3</text>
    <text class="label" x="467" y="603">4 Beat bank</text>
    <text class="ref" x="619" y="603">T4</text>
    <text class="label" x="651" y="603">Toggle variation</text>
    <text class="hint" x="651" y="626">Function + T4 pins / unpins</text>
  </g>
</svg>
