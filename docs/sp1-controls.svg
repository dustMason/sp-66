<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="646" viewBox="0 0 900 646" role="img"
     aria-labelledby="title description">
  <title id="title">SP-66 controls on the Teenage Engineering SP-1</title>
  <desc id="description">Line drawing of the SP-1 front, right edge, and ports, with top and left
    edge details. The top buttons change volume. The left rocker steps through A, Auto, and B.
    Press its upper end toward B or its lower end toward A. Faders 1 to 4 set tempo, balance,
    base rhythm, and variation preset. Track buttons 1 to 3 select Rock, 2 Beat, and 4 Beat.
    Track 4 toggles the variation. Hold Function and tap Track 4 to pin or unpin the selected
    base rhythm. Track LEDs show bank and variation status. The right edge has Play for
    start and stop, four LEDs for Arrange and bar position, and Function. Tap Function for
    a fill or hold it to shut down. Connect a MIDI clock host to the USB-C port.
    The headphone jack is the one next to USB-C.</desc>

  <style>
    .metal, .rim, .back, .cap, .cap-edge, .key, .pin, .cutout {
      stroke: #30332f;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .metal { fill: #e5e6e2; }
    .rim { fill: #c8cbc4; }
    .back { fill: #d4d6d1; }
    .cap { fill: #ede8da; }
    .cap-edge { fill: #ddd7c8; }
    .key { fill: #f0f0eb; }
    .pin { fill: #bcc1bb; }
    .cutout { fill: #313430; }
    .etch, .bevel, .leader {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .etch { stroke: #81857c; stroke-width: 1; }
    .bevel { stroke: #f8f8f3; stroke-width: 1.1; }
    .leader { stroke: #74786e; stroke-width: 1.15; }
    .hole { fill: #383b36; }
    .lit { fill: #fcf9e8; stroke: #53554d; stroke-width: 1.05; }
    .play { fill: #aa3627; }
    .label, .hint { font-family: "Instrument Sans", Arial, sans-serif; }
    .label { fill: #252823; font-size: 21px; font-weight: 600; }
    .hint { fill: #4e524a; font-size: 17px; }
    .id {
      fill: #91372b;
      font: 600 16px "IBM Plex Mono", "Courier New", monospace;
    }
  </style>

