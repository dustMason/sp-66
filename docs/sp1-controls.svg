<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="600" viewBox="0 0 900 600" role="img"
     aria-labelledby="title desc">
  <title id="title">SP-66 control map on the Teenage Engineering SP-1</title>
  <desc id="desc">Front and edge line drawing of the SP-1. From left to right, the faders set tempo,
    balance, base rhythm and variation preset. Track buttons 1 through 3 select Rock, 2 Beat and
    4 Beat. Track 4 toggles the variation layer. The left rocker moves up toward B and down toward A,
    with Auto between them. The top buttons change volume. The front LEDs show the selected bank and
    whether the variation is on. The right edge has Play, four Arrange and bar LEDs, and Function.
    Press Function for a fill or hold it to shut down.</desc>

  <style>
    .shell, .edge, .endcap, .key, .detail, .slot, .leader, .port {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .shell { fill: #efefeb; stroke: #353733; stroke-width: 1.75; }
    .edge { fill: #dbdcd6; stroke: #353733; stroke-width: 1.55; }
    .endcap { fill: #e8e2d5; stroke: #353733; stroke-width: 1.55; }
    .key { fill: #f5f3ed; stroke: #454742; stroke-width: 1.35; }
    .detail { fill: none; stroke: #777973; stroke-width: 1; }
    .slot { fill: #30332f; stroke: #20231f; stroke-width: 1.1; }
    .port { fill: #464843; stroke: #353733; stroke-width: 1.15; }
    .leader { fill: none; stroke: #85827a; stroke-width: 1.15; }
    .hole { fill: #555750; }
    .active { fill: #a53827; }
    .label { fill: #242622; font: 600 18px "Instrument Sans", system-ui, sans-serif; }
    .hint { fill: #4c4e47; font: 15px "Instrument Sans", system-ui, sans-serif; }
    .id { fill: #813d30; font: 14px "IBM Plex Mono", ui-monospace, monospace; }
  </style>

  <defs>
    <g id="fader-slot">
      <rect class="slot" x="-4" y="212" width="8" height="113" rx="4"/>
      <path d="M1 216v105" fill="none" stroke="#60645b" stroke-width="1"/>
    </g>
    <g id="fader-pin">
      <path class="key" d="M-6-2v5c0 2.2 2.7 4 6 4s6-1.8 6-4v-5Z"/>
      <ellipse class="key" cx="0" cy="-2" rx="6" ry="4"/>
    </g>
    <g id="track-key">
      <rect class="key" x="-9" y="370" width="18" height="41" rx="2.5"/>
      <path class="detail" d="M7 374v33q0 2-2 2h-10"/>
    </g>
  </defs>

  <rect width="900" height="600" fill="#faf8f1"/>

  <!-- Show the edge controls in the same view as the front panel. -->
  <path class="edge" d="M300 117h270q17 0 26 14v325q0 13-13 23H313q-13 0-20-13l-4-11V136q0-13 11-19Z"/>
  <path class="edge" d="M299 440h287v21l-12 20H311q-12 0-17-12Z"/>
  <path class="shell" d="M307 122h263q13 0 13 13v319q0 13-13 13H307q-13 0-13-13V135q0-13 13-13Z"/>
  <path class="endcap" d="M546 122h24q13 0 13 13v319q0 13-13 13h-24Z"/>
  <path class="endcap" d="M546 467h24q11 0 15-9l-3 14-8 9h-28Z"/>
  <path class="detail" d="M300 139v310q0 12 12 12h225"/>
  <path class="detail" d="M580 465l7 9"/>

  <!-- Top edge volume buttons. -->
  <ellipse class="edge" cx="348" cy="118" rx="8" ry="4.8"/>
  <ellipse class="edge" cx="379" cy="118" rx="8" ry="4.8"/>
  <ellipse class="key" cx="348" cy="115" rx="8" ry="4.8"/>
  <ellipse class="key" cx="379" cy="115" rx="8" ry="4.8"/>

  <!-- Rocker and the play / LED / function edge. -->
  <rect class="key" x="282" y="153" width="15" height="60" rx="6"/>
  <path class="detail" d="M284 183h11"/>
  <circle class="hole" cx="289" cy="233" r="1.6"/>
  <rect class="key" x="585" y="154" width="13" height="30" rx="3"/>
  <path class="active" d="M558 162l11 7-11 7Z"/>
  <g class="hole">
    <circle cx="589" cy="247" r="2.4"/>
    <circle cx="589" cy="266" r="2.4"/>
    <circle cx="589" cy="285" r="2.4"/>
    <circle cx="589" cy="304" r="2.4"/>
    <circle cx="564" cy="399" r="2"/>
    <circle cx="564" cy="407" r="2"/>
  </g>
  <rect class="key" x="585" y="388" width="13" height="30" rx="3"/>

  <!-- Front panel fader slots, metal pins, LEDs and track keys. -->
  <g>
    <use xlink:href="#fader-slot" x="335"/>
    <use xlink:href="#fader-slot" x="397"/>
    <use xlink:href="#fader-slot" x="459"/>
    <use xlink:href="#fader-slot" x="521"/>
    <use xlink:href="#fader-pin" x="335" y="245"/>
    <use xlink:href="#fader-pin" x="397" y="268"/>
    <use xlink:href="#fader-pin" x="459" y="293"/>
    <use xlink:href="#fader-pin" x="521" y="226"/>
    <use xlink:href="#track-key" x="335"/>
    <use xlink:href="#track-key" x="397"/>
    <use xlink:href="#track-key" x="459"/>
    <use xlink:href="#track-key" x="521"/>
    <circle class="active" cx="335" cy="354" r="2.7"/>
    <circle class="hole" cx="397" cy="354" r="2.5"/>
    <circle class="hole" cx="459" cy="354" r="2.5"/>
    <circle class="active" cx="521" cy="354" r="2.7"/>
  </g>
  <g class="id" text-anchor="middle">
    <text x="335" y="199">F1</text>
    <text x="397" y="199">F2</text>
    <text x="459" y="199">F3</text>
    <text x="521" y="199">F4</text>
  </g>

  <rect class="port" x="326" y="470" width="36" height="6" rx="3"/>
  <ellipse class="port" cx="471" cy="473" rx="5" ry="3.3"/>
  <ellipse class="port" cx="519" cy="473" rx="5" ry="3.3"/>

  <!-- Callouts -->
  <path class="leader" d="M348 108V96h31v12m-15-12V83"/>
  <text class="label" x="364" y="54" text-anchor="middle">Volume − / +</text>
  <text class="hint" x="364" y="75" text-anchor="middle">Master output</text>

  <path class="leader" d="M226 183h50m0-17v34m0-34h4m-4 34h4"/>
  <text class="label" x="48" y="159">Arrange rocker</text>
  <text class="hint" x="48" y="183">Up toward B</text>
  <text class="hint" x="48" y="204">Down toward A</text>
  <text class="hint" x="48" y="225">Auto between A and B</text>

  <g>
    <text class="id" x="48" y="275">F1</text>
    <text class="label" x="80" y="275">Tempo</text>
    <text class="hint" x="80" y="295">50–200 BPM</text>

    <text class="id" x="48" y="329">F2</text>
    <text class="label" x="80" y="329">Balance</text>
    <text class="hint" x="80" y="349">Bass drum / treble</text>

    <text class="id" x="48" y="383">F3</text>
    <text class="label" x="80" y="383">Base rhythm</text>
    <text class="hint" x="80" y="403">Off or one of 9 rhythms</text>

    <text class="id" x="48" y="437">F4</text>
    <text class="label" x="80" y="437">Variation preset</text>
    <text class="hint" x="80" y="457">One of 6 in the selected bank</text>
  </g>

  <path class="leader" d="M601 169h48
                          M602 247h10v57h-10 M612 276h37
                          M531 354h118
                          M601 403h48"/>
  <text class="label" x="662" y="168">Play</text>
  <text class="hint" x="662" y="190">Start or stop</text>
  <text class="label" x="662" y="271">Side LEDs</text>
  <text class="hint" x="662" y="293">Arrange and bar position</text>
  <text class="label" x="662" y="344">Track LEDs</text>
  <text class="hint" x="662" y="366">Bank and variation on / off</text>
  <text class="label" x="662" y="398">Function</text>
  <text class="hint" x="662" y="420">Tap for a fill</text>
  <text class="hint" x="662" y="441">Hold to shut down</text>

  <path class="leader" d="M335 418v24l-19 23v17l-78 34
                          M397 418v24l-8 23v17l-20 34
                          M459 418v24l-6 23v17l47 34
                          M521 418v24l17 23v17l93 34"/>
  <g text-anchor="middle">
    <text class="id" x="238" y="538">T1</text>
    <text class="label" x="238" y="563">Rock bank</text>
    <text class="id" x="369" y="538">T2</text>
    <text class="label" x="369" y="563">2 Beat bank</text>
    <text class="id" x="500" y="538">T3</text>
    <text class="label" x="500" y="563">4 Beat bank</text>
    <text class="id" x="631" y="538">T4</text>
    <text class="label" x="631" y="563">Toggle variation</text>
  </g>
</svg>
