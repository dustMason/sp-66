  <path class="bevel" d="M274 132v96"/>
  <path class="cutout" d="M253 153h18v57h-18Z"/>
  <path class="cap" d="M256 155q7-5 12 1v51q-5 6-12 1Z"/>
  <path class="etch" d="M258 181.5h8"/>
